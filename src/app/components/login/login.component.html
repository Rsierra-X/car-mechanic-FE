<div class="flex justify-center items-center min-h-screen bg-cover bg-center login-container" >
  <div class="flex bg-white shadow-lg rounded-lg overflow-hidden w-[500px] backdrop-blur-md bg-opacity-80">
    <div class="bg-blue-600 flex justify-center items-center w-1/3 p-4">
      <span class="text-white text-4xl">🔒</span>
    </div>
    <div class="w-2/3 p-6">
      <form (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700">Usuario</label>
          <input type="text" id="username" class="mt-1 block w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" [(ngModel)]="username" name="username" required>
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
          <div class="relative">
            <input type="password" id="password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-gray-100 focus:outline-none focus:ring-blue-500 focus:border-blue-500 pr-10" [(ngModel)]="password" name="password" required>
          </div>
        </div>
        <div class="flex justify-center items-center mt-4">
          <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-6 rounded-md">Ingresar</button>
        </div>
      </form>
    </div>
  </div>
</div>
