<div class="bg-white rounded-xl shadow overflow-auto mt-4">
  <table class="min-w-full text-sm">
    <thead class="bg-gray-100">
    <tr>
      <th *ngFor="let header of headers" class="text-left px-4 py-2">{{ header }}</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let row of rows; let i = index" class="border-t">
      <td *ngFor="let header of headers" class="px-4 py-2">
        @if (header !== 'Acciones') {
          {{ row[header] }}
        } @else {
          <div class="flex gap-2 items-center">
            <div class="flex gap-2 items-center">
              @if (showEdit) {
                <button (click)="onEditClick(row)" title="Editar">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-pen-icon lucide-square-pen text-blue-500 hover:text-blue-700"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>
                </button>
              }

              <button (click)="onDeleteClick(row)" title="Eliminar">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-red-500 hover:text-red-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6h14z"/>
                </svg>
              </button>
            </div>
          </div>
        }
      </td>
    </tr>
    </tbody>
  </table>
</div>
