<div class="bg-white rounded-xl shadow overflow-auto mt-4">
  <table class="min-w-full text-sm">
    <thead class="bg-gray-100">
    <tr>
      <th *ngFor="let header of headers" class="text-left px-4 py-2">{{ header }}</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let row of rows; let i = index" class="border-t">
      <td class="px-4 py-2">{{ row.UsuarioID }}</td>
      <td class="px-4 py-2">{{ row.NombreUsuario }}</td>
      <td class="px-4 py-2">{{ row.Rol }}</td>
      <td class="px-4 py-2">
        <button (click)="onDelete.emit(row.UsuarioID)" class="text-red-500 hover:underline">Eliminar</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
