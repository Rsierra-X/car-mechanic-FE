<div class="bg-white rounded-xl shadow overflow-auto mt-4">
  <table class="min-w-full text-sm">
    <thead class="bg-gray-100">
    <tr>
      <th *ngFor="let header of headers" class="text-left px-4 py-2">{{ header }}</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let row of rows; let i = index" class="border-t">
      <td *ngFor="let header of headers" class="px-4 py-2">
        @if (header !== 'Acciones') {
          @if (header === 'Estado') {
            <span class="text-sm font-medium px-2 py-1 rounded-full" [ngClass]="getEstadoClasses(row[header])">
          {{ row[header] }}
        </span>
          } @else {
            {{ row[header] }}
          }
        } @else {
          <div class="flex gap-2 items-center">
            <div class="flex gap-2 items-center">
              @if (showUpdateStatus && row.Estado !== 'Entregada') {
                <button (click)="onUpdateStatusClick(row)" title="Actualizar estado">
                  <svg fill="none" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg" class="text-yellow-500" >
                    <path d="M16.7488 2C17.9915 2 18.9988 3.00736 18.9988 4.25V19.75C18.9988 20.9926 17.9915 22 16.7488 22H11.1904C11.6168 21.5557 11.9806 21.051 12.2678 20.5H16.7488C17.163 20.5 17.4988 20.1642 17.4988 19.75V4.25C17.4988 3.83579 17.163 3.5 16.7488 3.5H6.25C5.83579 3.5 5.5 3.83579 5.5 4.25V11.0764C4.97679 11.1572 4.47417 11.3004 4 11.4982V4.25C4 3.00736 5.00736 2 6.25 2H16.7488ZM20 15.0019H20.75C21.1297 15.0019 21.4435 15.2841 21.4932 15.6502L21.5 15.7519V17.25C21.5 17.6297 21.2178 17.9435 20.8518 17.9932L20.75 18H20V15.0019ZM20 11.0019H20.75C21.1297 11.0019 21.4435 11.2841 21.4932 11.6502L21.5 11.7519V13.25C21.5 13.6297 21.2178 13.9435 20.8518 13.9932L20.75 14H20V11.0019ZM20 7.00194H20.75C21.1297 7.00194 21.4435 7.28409 21.4932 7.65017L21.5 7.75194V9.25C21.5 9.6297 21.2178 9.94349 20.8518 9.99315L20.75 10H20V7.00194ZM15.2488 5C15.663 5 15.9988 5.33579 15.9988 5.75V8.2485C15.9988 8.66272 15.663 8.9985 15.2488 8.9985H7.75C7.33579 8.9985 7 8.66272 7 8.2485V5.75C7 5.33579 7.33579 5 7.75 5H15.2488ZM14.4988 6.5H8.5V7.4985H14.4988V6.5ZM1 17.5C1 20.5376 3.46243 23 6.5 23C9.53757 23 12 20.5376 12 17.5C12 14.4624 9.53757 12 6.5 12C3.46243 12 1 14.4624 1 17.5ZM9.5 14C9.77614 14 10 14.2239 10 14.5V16.5C10 16.7761 9.77614 17 9.5 17H7.5C7.22386 17 7 16.7761 7 16.5C7 16.2239 7.22386 16 7.5 16H8.50027C8.04362 15.392 7.31737 15 6.50002 15C5.66657 15 4.9283 15.4073 4.47325 16.036C4.31133 16.2597 3.99874 16.3098 3.77505 16.1478C3.55136 15.9859 3.50128 15.6733 3.6632 15.4496C4.29822 14.5724 5.33229 14 6.50002 14C7.47976 14 8.3651 14.4027 9 15.0506V14.5C9 14.2239 9.22386 14 9.5 14ZM4 19.9494V20.5C4 20.7761 3.77614 21 3.5 21C3.22386 21 3 20.7761 3 20.5V18.5C3 18.2239 3.22386 18 3.5 18H5.5C5.77614 18 6 18.2239 6 18.5C6 18.7761 5.77614 19 5.5 19H4.49976C4.95641 19.608 5.68266 20 6.50002 20C7.26635 20 7.95179 19.6558 8.41116 19.1118C8.58932 18.9008 8.90478 18.8742 9.11576 19.0523C9.32675 19.2305 9.35336 19.546 9.17521 19.7569C8.53396 20.5164 7.57322 21 6.50002 21C5.52026 21 4.6349 20.5973 4 19.9494Z" fill="#212121"/></svg>
                </button>
              }

              @if (showEdit) {
                <button (click)="onEditClick(row)" title="Editar">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-pen-icon lucide-square-pen text-blue-500 hover:text-blue-700"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>
                </button>
              }

              <button (click)="onDeleteClick(row)" title="Eliminar">
                <!-- Icono Eliminar -->
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-red-500 hover:text-red-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6h14z"/>
                </svg>
              </button>

              @if (showDownload) {
                <button (click)="onDownloadClick(row)" title="Descargar orden">
                  <svg fill="none" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M18.2498 20.4999C18.664 20.4998 19 20.8355 19 21.2497C19 21.6639 18.6644 21.9998 18.2502 21.9999L5.25022 22.0037C4.836 22.0038 4.5 21.6681 4.5 21.2539C4.5 20.8397 4.83557 20.5038 5.24978 20.5037L18.2498 20.4999ZM11.6482 2.01173L11.75 2.00488C12.1297 2.00488 12.4435 2.28704 12.4932 2.65311L12.5 2.75488L12.499 16.4399L16.2208 12.7196C16.4871 12.4533 16.9038 12.4291 17.1974 12.647L17.2815 12.7197C17.5477 12.986 17.5719 13.4026 17.354 13.6962L17.2814 13.7803L12.2837 18.7769C12.0176 19.043 11.6012 19.0673 11.3076 18.8498L11.2235 18.7772L6.22003 13.7806C5.92694 13.4879 5.92661 13.0131 6.21931 12.72C6.48539 12.4535 6.90204 12.429 7.1958 12.6467L7.27997 12.7192L10.999 16.4329L11 2.75488C11 2.37519 11.2822 2.06139 11.6482 2.01173L11.75 2.00488L11.6482 2.01173Z" fill="#212121"/>
                  </svg>
                </button>
              }


            </div>
          </div>
        }
      </td>
    </tr>
    </tbody>
  </table>
</div>
