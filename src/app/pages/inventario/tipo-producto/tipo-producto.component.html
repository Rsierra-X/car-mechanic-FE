<app-catalog-layout title="Tipo de producto"
                    [fields]="['nombre']"
                    (onSearch)="search($event)">
  <div class="bg-white rounded-xl shadow p-6">
    <div class="flex justify-end items-center mb-4">
      <app-button btnId="btn-add-user"
                  iconType="plus"
                  btnText="Agregar tipo de producto"
                  btnColor="btn-blue"
                  padding=""
                  margin=""
                  (btnClicked)="showModal = true">
      </app-button>
    </div>
    <app-simple-table
      [headers]="['id', 'nombre','Acciones']"
      [rows]="marcas"
      [showEdit]="true"
      (onDelete)="delete($event)"
      (onEdit)="edit($event)">
    </app-simple-table>
  </div>
</app-catalog-layout>
@if (showModal) {
  <div class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-6 relative">
      @if (isModalEdit) {
        <h2 class="text-xl font-semibold mb-4">Editar Tipo de producto</h2>
      } @else {
        <h2 class="text-xl font-semibold mb-4">Agregar Tipo de producto</h2>
      }

      <form [formGroup]="marcaForm" >
        <div class="space-y-4">
          <!-- Nombre -->
          <label class="block">
            <span class="text-gray-700">Nombre *</span>
            <input formControlName="nombre" type="text" class="mt-1 block w-full border rounded px-3 py-2" />
            <div *ngIf="marcaForm.get('nombre')?.invalid && marcaForm.get('nombre')?.touched" class="text-red-500 text-sm">
              Nombre es requerido.
            </div>
          </label>
        </div>

        <div class="mt-6 flex justify-end ">
          <app-button btnId="btn-cancel"
                      btnText="Cancelar"
                      btnColor="btn-gray"
                      margin=""

                      (btnClicked)="showModal = false">
          </app-button>

          <button type="submit">
            <app-button btnId="btn-save"
                        btnText="Guardar"
                        margin=""
                        padding=""
                        btnColor="btn-green"
                        (btnClicked)="isModalEdit ? update() : create()">
            </app-button>
          </button>
        </div>
      </form>
    </div>
  </div>
}
