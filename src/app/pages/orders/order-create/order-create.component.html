<div class="container mx-auto p-6 max-w-5xl h-[90vh] overflow-y-auto space-y-6">

  <!-- Encabezado -->
  <h2 class="text-2xl font-semibold">Crear Orden de Trabajo</h2>

  <!-- Cliente -->
  <div class="bg-white rounded-xl shadow p-6">
    <h3 class="text-lg font-semibold mb-4">Datos del Cliente</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block font-medium mb-1">Cliente</label>
        <select formControlName="clientId" (change)="onClientChange($event)" class="form-select w-full">
          <option [ngValue]="null">-- Seleccionar Cliente --</option>
          <option *ngFor="let client of clients" [ngValue]="client.ClienteID">
            {{ client.Nombre }}
          </option>
        </select>
        <div *ngIf="orderForm.get('clientId')?.touched && orderForm.get('clientId')?.invalid" class="text-red-500 text-sm">
          Cliente es obligatorio.
        </div>
      </div>

      <div>
        <label class="block font-medium mb-1">NIT</label>
        <input type="text" formControlName="clientNit" class="form-input w-full"  />
      </div>
    </div>
  </div>

  <!-- Vehículo -->
  <div class="bg-white rounded-xl shadow p-6">
    <h3 class="text-lg font-semibold mb-4">Datos del Vehículo</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block font-medium mb-1">Marca</label>
        <input type="text" formControlName="brand" class="form-input w-full" />
      </div>
      <div>
        <label class="block font-medium mb-1">Tipo</label>
        <input type="text" formControlName="type" class="form-input w-full" />
      </div>
      <div>
        <label class="block font-medium mb-1">Color</label>
        <input type="text" formControlName="color" class="form-input w-full" />
      </div>
      <div>
        <label class="block font-medium mb-1">Año</label>
        <input type="text" formControlName="year" class="form-input w-full" />
      </div>
      <div>
        <label class="block font-medium mb-1">Placa</label>
        <input type="text" formControlName="plate" class="form-input w-full" />
      </div>
      <div>
        <label class="block font-medium mb-1">Próximo Servicio</label>
        <input type="text" formControlName="nextService" class="form-input w-full" />
      </div>
    </div>
  </div>

  <!-- Detalle -->
  <div class="bg-white rounded-xl shadow p-6">
    <h3 class="text-lg font-semibold mb-4">Productos / Servicios</h3>

    <div formArrayName="orderDetails" class="space-y-4">
      <div *ngFor="let detail of orderDetails.controls; let i = index" [formGroupName]="i"
           class="grid grid-cols-1 md:grid-cols-4 gap-4 items-center border p-4 rounded-lg">

        <div>
          <label class="block font-medium mb-1">Producto / Servicio</label>
          <select formControlName="productId" (change)="onProductOrServiceChange(i)" class="form-select w-full">
            <option [ngValue]="null">-- Seleccionar --</option>
            <option *ngFor="let item of productsAndServices" [ngValue]="item.id">{{ item.name }}</option>
          </select>
        </div>

        <div>
          <label class="block font-medium mb-1">Descripción</label>
          <input formControlName="description" class="form-input w-full"  />
        </div>

        <div>
          <label class="block font-medium mb-1">Cantidad</label>
          <input type="number" formControlName="quantity" class="form-input w-full" min="1" />
        </div>

        <div>
          <label class="block font-medium mb-1">Precio Unitario</label>
          <input type="number" formControlName="unitPrice" class="form-input w-full"  />
        </div>

        <div class="col-span-1 md:col-span-4 text-right">
          <button type="button" (click)="removeDetail(i)" class="text-red-600 hover:underline">Eliminar</button>
        </div>
      </div>
    </div>

    <div class="mt-4">
      <button type="button" (click)="addDetail()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        Agregar Producto / Servicio
      </button>
    </div>
  </div>

  <!-- Totales -->
  <div class="bg-white rounded-xl shadow p-6">
    <h3 class="text-lg font-semibold mb-4">Totales</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block font-medium mb-1">Mano de Obra</label>
        <input type="number" formControlName="laborCost" class="form-input w-full" />
      </div>

      <div>
        <label class="block font-medium mb-1">Abono</label>
        <input type="number" formControlName="abono" class="form-input w-full" />
      </div>
    </div>

    <div class="mt-4 border-t pt-4">
      <p><strong>Subtotal:</strong> Q{{ calculateSubtotal() | number:'1.2-2' }}</p>
      <p><strong>Total:</strong> Q{{ calculateTotal() | number:'1.2-2' }}</p>
    </div>
  </div>

  <!-- Botones -->
  <div class="flex justify-end gap-4">
    <button type="button" class="bg-gray-300 px-4 py-2 rounded" routerLink="/orders">Cancelar</button>
    <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700">Guardar Orden</button>
  </div>
</div>
