<form [formGroup]="orderForm">
<div class=" p-6 w-full h-[100vh] overflow-y-auto space-y-6">

  <!-- Encabezado -->
  <h2 class="text-2xl font-semibold">Crear Orden de Trabajo</h2>

  <!-- Cliente -->

  <div class="bg-white rounded-xl shadow p-6">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-lg font-semibold">Datos del Cliente</h3>
      <app-button
        btnId="btn-logout"
        iconType="plus"
        btnText="Nuevo Cliente"
        margin=""
        padding=""
        btnColor="btn-green"
        (btnClicked)="showModal = true"
      >
      </app-button>
    </div>


    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block font-medium mb-1">Cliente</label>
        <select formControlName="clientId" (change)="onClientChange($event)" class="border border-gray-300 rounded px-3 py-1 text-md w-full">
          <option [ngValue]="null">-- Seleccionar Cliente --</option>
          <option *ngFor="let client of clients" [ngValue]="client.ClienteID">
            {{ client.Nombre }}
          </option>
        </select>
        <div *ngIf="orderForm.get('clientId')?.touched && orderForm.get('clientId')?.invalid" class="text-red-500 text-sm">
          Cliente es obligatorio.
        </div>
      </div>

      <div>
        <label class="block font-medium mb-1">NIT</label>
        <input type="text" formControlName="clientNit" class="border border-gray-300 rounded px-3 py-1 text-md w-full" [disabled]="true" />
      </div>
    </div>
  </div>

  <!-- Vehículo -->
  <div class="bg-white rounded-xl shadow p-6">
    <h3 class="text-lg font-semibold mb-4">Datos del Vehículo</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
  <label class="block font-medium mb-1">Marca</label>
  <select formControlName="brand" class="border border-gray-300 rounded px-3 py-1 text-md w-full">
    <option [ngValue]="null">-- Seleccionar Marca --</option>
    <option *ngFor="let marca of marcas" [value]="marca">{{ marca }}</option>
  </select>
</div>

<div>
  <label class="block font-medium mb-1">Tipo</label>
  <select formControlName="type" class="border border-gray-300 rounded px-3 py-1 text-md w-full">
    <option [ngValue]="null">-- Seleccionar Tipo --</option>
    <option *ngFor="let tipo of tipos" [value]="tipo">{{ tipo }}</option>
  </select>
</div>
      <div>
        <label class="block font-medium mb-1">Color</label>
        <input type="text" formControlName="color" class="border border-gray-300 rounded px-3 py-1 text-md w-full" />
      </div>
      <div>
        <label class="block font-medium mb-1">Año</label>
        <input type="text" formControlName="year" class="border border-gray-300 rounded px-3 py-1 text-md w-full" />
      </div>
      <div>
        <label class="block font-medium mb-1">Placa</label>
        <input type="text" formControlName="plate" class="border border-gray-300 rounded px-3 py-1 text-md w-full" />
      </div>
      <div>
        <label class="block font-medium mb-1">Próximo Servicio</label>
        <input type="text" formControlName="nextService" class="border border-gray-300 rounded px-3 py-1 text-md w-full" />
      </div>
    </div>
  </div>

  <!-- Detalle -->
  <div class="bg-white rounded-xl shadow p-6">
    <h3 class="text-lg font-semibold mb-4">Productos / Servicios</h3>

    <div formArrayName="orderDetails" class="space-y-4">
      <div *ngFor="let detail of orderDetails.controls; let i = index" [formGroupName]="i"
           class="grid grid-cols-1 md:grid-cols-5 gap-5 items-center border p-4 rounded-lg">

        <div>
          <label class="block font-medium mb-1">Producto / Servicio</label>
          <select formControlName="productSelected" (change)="onProductOrServiceChange(i)" class="border border-gray-300 rounded px-3 py-1 text-md w-full">
            <option [ngValue]="null">-- Seleccionar --</option>
            <option *ngFor="let item of productOrService" [ngValue]="item.id">{{ item.name }}</option>
          </select>
        </div>

        <div>
          <label class="block font-medium mb-1">Producto / Servicio</label>
          <select formControlName="productId" (change)="onProductAndServiceChange(i)" class="border border-gray-300 rounded px-3 py-1 text-md w-full">
            <option [ngValue]="null">-- Seleccionar --</option>
            <option *ngFor="let item of productAndService" [ngValue]="item.ProductoID ?? item.ServicioID">{{ item.Nombre }}</option>
          </select>
        </div>

        <div>
          <label class="block font-medium mb-1">Descripción</label>
          <input formControlName="description" class="border border-gray-300 rounded px-3 py-1 text-md w-full"  />
        </div>

        <div>
          <label class="block font-medium mb-1">Cantidad</label>
          <input type="number" formControlName="quantity" class="border border-gray-300 rounded px-3 py-1 text-md w-full" min="1" />
        </div>

        <div>
          <label class="block font-medium mb-1">Precio Unitario</label>
          <input type="number" formControlName="unitPrice" class="border border-gray-300 rounded px-3 py-1 text-md w-full"  />
        </div>

        <div class="col-span-1 md:col-span-5 text-right">
          <button (click)="removeDetail(i)" type="button" title="Eliminar">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-red-500 hover:text-red-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6h14z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="mt-4">

      <button type="button" (click)="addDetail()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        Agregar Producto / Servicio
      </button>
    </div>
  </div>

  <!-- Totales -->
  <div class="bg-white rounded-xl shadow p-6">
    <h3 class="text-lg font-semibold mb-4">Totales</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block font-medium mb-1">Mano de Obra</label>
        <input type="number" formControlName="laborCost" class="border border-gray-300 rounded px-3 py-1 text-md w-full" />
      </div>

      <div>
        <label class="block font-medium mb-1">Abono</label>
        <input type="number" formControlName="abono" class="border border-gray-300 rounded px-3 py-1 text-md w-full" />
      </div>
    </div>

    <div class="mt-4 border-t pt-4">
      <p><strong>Subtotal:</strong> Q{{ calculateSubtotal() | number:'1.2-2' }}</p>
      <p><strong>Total:</strong> Q{{ calculateTotal() | number:'1.2-2' }}</p>
    </div>
  </div>

  <!-- Botones -->
  <div class="flex justify-end gap-4">
    <button type="button" class="bg-gray-300 px-4 py-2 rounded" routerLink="/orders">Cancelar</button>
    <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700" (click)="saveOrder()">Guardar Orden</button>
  </div>
</div>
</form>

@if (showModal) {
  <app-client-modal (showModal)="showModal = $event" (onCFChange)="onCFChange()" (onCreate)="create()"  [isModalEdit]="false" [clientForm]="clientForm" ></app-client-modal>
}
